[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-cuda"
version = "0.1.0"
description = "Native CUDA/CPU inference for Laya typed decision models - RTX + Ryzen port of laya-mlx"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["laya", "typed-decisions", "cuda", "rtx", "local-ai", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core - CUDA 12.x wheel (pip install torch --index-url https://download.pytorch.org/whl/cu124)
    "torch>=2.3",
    "safetensors>=0.4",
    "numpy>=1.26",
    "huggingface-hub>=0.34,<2",
    "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
# TensorRT path (maximum speed - Tier 3)
trt = [
    "tensorrt>=10.0",
    "cuda-python>=12.4",
]
# Development
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
laya-bench = "laya_cuda._bench:main"

[tool.hatch.build.targets.wheel]
packages = ["laya_cuda"]

[tool.ruff]
line-length = 100
target-version = "py311"
